<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bob : les projets, pas à pas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --page: #e6eaf2;
  --page-ink: #1e293b;
  --page-muted: #5b6b82;
  --panel: #ffffff;
  --panel-line: #d6dce7;
  --accent: #4f46e5;
  --accent-soft: #eef0ff;
  --accent-ink: #ffffff;
  --ring: #6366f1;
  --dim: rgba(15, 23, 42, 0.42);
  --rail-off: #c9d1de;

  /* Bob lui-même (réplique, toujours claire comme l'application) */
  --b-side: #0f172a; --b-side-hover: #1e293b; --b-side-text: #cbd5e1; --b-side-label: #64748b;
  --b-body: #f1f5f9; --b-white: #ffffff; --b-line: #e2e8f0; --b-ink: #1e293b; --b-muted: #64748b; --b-faint: #94a3b8;
  --b-indigo: #4f46e5; --b-indigo-50: #eef2ff; --b-indigo-200: #c7d2fe; --b-indigo-800: #3730a3;
  --b-orange: #f97316; --b-orange-50: #fff7ed; --b-orange-200: #fed7aa; --b-orange-700: #c2410c;
  --b-rose: #f43f5e; --b-green: #10b981; --b-green-50: #ecfdf5; --b-red: #ef4444; --b-kanban: #f4f7fa;

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111a2e; --page-ink: #e5e9f2; --page-muted: #96a3b9;
    --panel: #18233a; --panel-line: #2a3853; --accent: #818cf8; --accent-soft: #232d4d; --accent-ink: #0f172a;
    --rail-off: #33415c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111a2e; --page-ink: #e5e9f2; --page-muted: #96a3b9;
  --panel: #18233a; --panel-line: #2a3853; --accent: #818cf8; --accent-soft: #232d4d; --accent-ink: #0f172a;
  --rail-off: #33415c; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--page); color: var(--page-ink); font-family: "Figtree", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.tour { max-width: 1440px; margin: 0 auto; padding: 20px 20px 28px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.tour-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.tour-head h1 { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -0.01em; }
.tour-head p { margin: 0; color: var(--page-muted); font-size: 0.95rem; }
.stage { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1180px) { .stage { grid-template-columns: minmax(0, 1fr) 340px; } }

/* Cadre de la réplique */
.frame { width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 50px -18px rgba(15, 23, 42, 0.45), 0 0 0 1px var(--panel-line); background: var(--b-body); position: relative; }
.frame-scale { position: relative; }
.bob { position: absolute; top: 0; left: 0; width: 1040px; height: 640px; transform-origin: 0 0; display: flex; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--b-ink); font-size: 13px; overflow: hidden; background: var(--b-body); user-select: none; -webkit-user-select: none; }
.ico { width: 1em; height: 1em; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; }

/* Barre latérale de Bob */
.b-side { width: 206px; background: var(--b-side); color: var(--b-side-text); display: flex; flex-direction: column; flex-shrink: 0; }
.b-logo { padding: 18px 20px 10px; display: flex; align-items: center; gap: 10px; color: var(--b-white); font-weight: 800; font-size: 16px; }
.b-logo span { width: 28px; height: 28px; border-radius: 8px; background: var(--b-indigo); display: grid; place-items: center; font-size: 14px; }
.b-navh { padding: 16px 20px 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--b-side-label); }
.b-nav { display: flex; align-items: center; gap: 10px; padding: 8px 20px 8px 17px; border-left: 3px solid transparent; cursor: pointer; font-size: 12.5px; }
.b-nav .ico { font-size: 14px; }
.b-nav:hover, .b-nav.on { background: var(--b-side-hover); color: var(--b-white); }
.b-nav.on { border-left-color: #6366f1; }
.b-badge { margin-left: auto; background: var(--b-orange); color: var(--b-white); border-radius: 99px; padding: 0 7px; font-size: 10px; font-weight: 700; }

.b-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.b-top { height: 54px; background: var(--b-white); border-bottom: 1px solid var(--b-line); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; flex-shrink: 0; }
.b-top h2 { margin: 0; font-size: 15px; font-weight: 700; }
.b-btn { border: 0; border-radius: 6px; padding: 7px 13px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.b-btn.indigo { background: var(--b-indigo); color: var(--b-white); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.b-btn.ghost { background: transparent; color: var(--b-muted); }
.b-btn.line { background: var(--b-white); color: var(--b-ink); border: 1px solid #cbd5e1; flex: 1; justify-content: center; }
.b-btn.orange { background: var(--b-orange-50); color: var(--b-orange-700); border: 1px solid var(--b-orange-200); flex: 1; justify-content: center; }
.b-btn.rose { background: var(--b-rose); color: var(--b-white); }
.b-btn.grey { background: #6e7881; color: var(--b-white); }
.b-content { flex: 1; overflow: hidden; padding: 16px 18px; background: var(--b-white); position: relative; }

/* Tableau de bord */
.b-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.b-kpi { border: 1px solid var(--b-line); border-radius: 14px; padding: 14px; background: var(--b-white); }
.b-kpi small { color: var(--b-muted); font-size: 11px; font-weight: 700; }
.b-kpi b { display: block; font-size: 24px; margin-top: 4px; }
.b-dash-note { margin-top: 16px; border: 1px dashed var(--b-line); border-radius: 14px; padding: 18px; color: var(--b-faint); font-size: 12px; }

/* Pipeline */
.b-pipehead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.b-pipehead h3 { margin: 0; font-size: 15px; display: flex; gap: 8px; align-items: center; }
.b-pipehead h3 .ico { color: var(--b-indigo); }
.b-fake-input { border: 1px solid var(--b-line); border-radius: 6px; padding: 6px 10px; color: var(--b-faint); font-size: 11.5px; display: inline-flex; gap: 6px; align-items: center; width: 150px; }
.b-board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; height: calc(100% - 42px); }
.b-col { border: 1px solid var(--b-line); border-radius: 12px; background: var(--b-kanban); display: flex; flex-direction: column; min-width: 0; transition: background-color .15s, border-color .15s; }
.b-col.over { background: var(--b-indigo-50); border-color: #818cf8; }
.b-colh { padding: 8px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #334155; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--b-line); gap: 4px; }
.b-colh i { display: inline-block; width: 7px; height: 7px; border-radius: 99px; margin-right: 5px; }
.b-colh em { font-style: normal; background: var(--b-white); border: 1px solid var(--b-line); border-radius: 99px; padding: 0 6px; color: var(--b-muted); }
.b-cards { padding: 7px; display: flex; flex-direction: column; gap: 7px; }
.b-card { background: var(--b-white); border: 1px solid var(--b-line); border-radius: 8px; padding: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.05); cursor: grab; touch-action: none; }
.b-card.won { border-color: #a7f3d0; }
.b-card.new { border-color: #a5b4fc; }
.b-card.lift { opacity: .35; }
.b-tag { display: inline-block; color: var(--b-white); font-size: 9px; font-weight: 700; border-radius: 4px; padding: 1px 5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-card .v { font-weight: 700; font-size: 11.5px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-card .c { color: var(--b-muted); font-size: 10.5px; margin-top: 2px; }
.b-card .f { font-size: 10.5px; font-weight: 700; margin-top: 5px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 6px; }
.b-card .f > span:first-child { white-space: nowrap; }
.b-card .r { color: var(--b-orange-700); font-size: 10px; display: inline-flex; gap: 3px; align-items: center; }
.ghost-card { position: absolute; pointer-events: none; z-index: 95; width: 118px; transform: rotate(-2deg); box-shadow: 0 12px 24px -6px rgba(15,23,42,.35); cursor: grabbing; }

/* Fenêtre affaire */
.b-overlay { position: absolute; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 40; }
.b-modal { width: 590px; max-height: 590px; background: var(--b-white); border-radius: 12px; box-shadow: 0 24px 60px -12px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
.b-mh { padding: 14px 18px; border-bottom: 1px solid var(--b-line); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
.b-mh h3 { margin: 0; font-size: 15px; }
.b-mb { padding: 14px 18px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; align-content: start; }
.b-mb .full { grid-column: 1 / -1; }
.b-mb .sep { border-top: 1px solid var(--b-line); padding-top: 10px; }
.b-lab { display: block; font-size: 10px; font-weight: 800; color: var(--b-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.b-lab b { color: var(--b-red); } .b-lab b.i { color: var(--b-indigo); }
.b-field { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 7px 9px; font-size: 12.5px; background: var(--b-white); color: var(--b-ink); font-family: inherit; min-height: 32px; }
.b-field.stage { background: var(--b-indigo-50); border-color: var(--b-indigo-200); color: var(--b-indigo-800); font-weight: 700; }
.b-field.empty { color: var(--b-faint); }
.b-venue { display: flex; align-items: center; gap: 9px; background: var(--b-indigo-50); border: 1px solid var(--b-indigo-200); border-radius: 8px; padding: 7px 10px; }
.b-venue .ico { color: var(--b-indigo); }
.b-venue b { display: block; color: var(--b-indigo-800); font-size: 12.5px; } .b-venue small { color: #6366f1; font-size: 11px; }
.b-browse { font-size: 9.5px; font-weight: 700; background: var(--b-indigo-50); color: var(--b-indigo-800); border-radius: 4px; padding: 3px 8px; display: inline-flex; gap: 4px; align-items: center; }
.b-rowlab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.b-fin { background: #f8fafc; border: 1px solid var(--b-line); border-radius: 10px; padding: 12px; }
.b-fin h4, .b-ed h4 { margin: 0 0 10px; font-size: 12.5px; color: #334155; display: flex; gap: 7px; align-items: center; }
.b-g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; } .b-g2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.b-coreal { background: #eef2f6; border: 1px solid var(--b-line); border-radius: 6px; padding: 10px; margin-top: 10px; display: grid; gap: 8px; }
.b-sum { background: var(--b-white); border: 1px solid var(--b-line); border-radius: 6px; padding: 8px 10px; font-size: 11px; color: var(--b-muted); display: grid; gap: 3px; }
.b-sum div { display: flex; justify-content: space-between; }
.b-sum .tot { border-top: 1px solid var(--b-line); padding-top: 5px; font-weight: 700; color: #334155; font-size: 12px; }
.b-sum .tot span:last-child { color: var(--b-green); } .b-sum .pm { color: var(--b-orange); font-weight: 700; }
.b-use { justify-self: end; font-size: 10px; font-weight: 700; background: var(--b-indigo-200); color: var(--b-indigo-800); border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.b-ed { border-top: 1px solid var(--b-line); padding-top: 12px; }
.b-ed .row { display: flex; gap: 10px; }
.b-mf { padding: 11px 18px; border-top: 1px solid var(--b-line); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; }
.b-del { color: var(--b-red); font-weight: 700; font-size: 12px; padding: 0 8px; background: none; border: 0; }

/* Boîtes de dialogue façon SweetAlert2 */
.b-swal-wrap { position: absolute; inset: 0; background: rgba(15,23,42,.4); display: flex; align-items: center; justify-content: center; z-index: 60; }
.b-swal { width: 380px; background: var(--b-white); border-radius: 8px; padding: 22px 22px 18px; text-align: center; box-shadow: 0 20px 50px -10px rgba(0,0,0,.4); }
.b-swal h3 { margin: 0 0 10px; font-size: 19px; color: #545454; font-weight: 600; }
.b-swal p { margin: 0 0 18px; color: #545454; font-size: 13.5px; }
.b-swal .acts { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
.b-swal .acts .b-btn { padding: 9px 15px; font-size: 13px; border-radius: 5px; }
.b-swal .form { text-align: left; display: grid; gap: 10px; }
.b-swal .quick { display: flex; gap: 6px; } .b-swal .quick button { flex: 1; border: 0; background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 700; border-radius: 7px; padding: 5px; cursor: pointer; }
.b-swal .quick button:hover { background: var(--b-indigo-50); color: var(--b-indigo-800); }
.b-swal .err { background: #f0f0f0; color: #545454; font-size: 12px; padding: 7px; border-radius: 4px; margin-top: 10px; }

.b-toast { position: absolute; bottom: 14px; right: 14px; z-index: 100; background: var(--b-white); border-radius: 8px; box-shadow: 0 10px 30px -8px rgba(15,23,42,.35); padding: 10px 14px; font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; border-left: 4px solid var(--b-green); animation: toastIn .25s ease-out; }
.b-toast .ico { color: var(--b-green); }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Projecteur */
.spot { position: absolute; z-index: 90; pointer-events: none; border-radius: 10px; box-shadow: 0 0 0 3px var(--ring), 0 0 0 9999px var(--dim); transition: top .35s cubic-bezier(.3,.7,.2,1), left .35s cubic-bezier(.3,.7,.2,1), width .35s cubic-bezier(.3,.7,.2,1), height .35s cubic-bezier(.3,.7,.2,1), opacity .2s; }
.spot::after { content: ""; position: absolute; inset: -3px; border-radius: inherit; box-shadow: 0 0 0 0 rgba(99,102,241,.55); animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99,102,241,.55); } 100% { box-shadow: 0 0 0 14px rgba(99,102,241,0); } }
.spot.off { opacity: 0; }
.flash { animation: flash .9s ease-out; }
@keyframes flash { 0% { background-color: #e0e7ff; } 100% { background-color: transparent; } }

/* Panneau de guidage */
.guide { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
.g-count { color: var(--page-muted); font-size: 0.85rem; font-weight: 600; }
.g-title { margin: 0; font-size: 1.32rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.01em; }
.g-body { display: grid; gap: 9px; font-size: 0.97rem; line-height: 1.55; color: var(--page-ink); }
.g-body p { margin: 0; }
.g-body strong { font-weight: 700; }
.g-do { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-weight: 600; font-size: 0.93rem; line-height: 1.45; }
.g-do .ico { font-size: 1.15rem; color: var(--accent); margin-top: 1px; }
.g-do.done .ico { color: #10b981; }
.g-tip { font-size: 0.88rem; color: var(--page-muted); line-height: 1.5; margin: 0; }
.g-nav { margin-top: auto; display: flex; gap: 8px; justify-content: space-between; padding-top: 6px; }
.g-btn { border-radius: 9px; padding: 10px 16px; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--panel-line); background: transparent; color: var(--page-ink); }
.g-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.g-btn:disabled { opacity: .4; cursor: default; }
.g-recap { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: r; }
.g-recap button { all: unset; cursor: pointer; display: flex; gap: 10px; padding: 5px 6px; border-radius: 7px; font-size: 0.93rem; }
.g-recap button:hover, .g-recap button:focus-visible { background: var(--accent-soft); }
.g-recap span { color: var(--page-muted); font-variant-numeric: tabular-nums; min-width: 1.4em; }

.rail { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rail button { all: unset; cursor: pointer; height: 30px; min-width: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; color: var(--page-muted); background: transparent; border: 1px solid var(--rail-off); font-variant-numeric: tabular-nums; }
.rail button.seen { color: var(--page-ink); border-color: var(--page-muted); }
.rail button.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rail button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.rail-hint { color: var(--page-muted); font-size: 0.85rem; margin-left: auto; }
@media (max-width: 720px) { .rail-hint { display: none; } .tour { padding: 14px 12px 22px; } .tour-head h1 { font-size: 1.3rem; } }

@media (prefers-reduced-motion: reduce) {
  .spot, .spot::after, .b-toast, .flash { transition: none !important; animation: none !important; }
}

/* Mes Projets */
.b-btn.slate { background: #1e293b; color: var(--b-white); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.b-pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.b-pcard { border: 1px solid var(--b-line); border-radius: 14px; overflow: hidden; background: var(--b-white); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.b-pcard .hd { height: 92px; display: grid; place-items: center; color: rgba(255,255,255,.5); font-size: 38px; }
.b-pcard .bd { padding: 12px 14px; }
.b-pcard h4 { margin: 0 0 3px; font-size: 15px; }
.b-pcard .genre { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--b-muted); }
.b-pcard .ft { margin-top: 14px; padding-top: 10px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; }
.b-pcard .ft span:first-child { color: var(--b-faint); font-weight: 700; display: inline-flex; gap: 4px; align-items: center; }
.b-pcard .ft b { color: #334155; }
.b-pcard .ft small { color: var(--b-faint); font-size: 9.5px; }

/* Fiche projet */
.b-pmodal { width: 720px; max-height: 590px; background: var(--b-white); border-radius: 12px; box-shadow: 0 24px 60px -12px rgba(0,0,0,.45); display: flex; flex-direction: column; overflow: hidden; }
.b-pban { height: 84px; position: relative; flex-shrink: 0; }
.b-pban .grad { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), transparent); display: flex; align-items: flex-end; padding: 0 22px 12px; color: var(--b-white); }
.b-pban small { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .8; margin-bottom: 2px; }
.b-pban h3 { margin: 0; font-size: 21px; }
.b-pban .close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 99px; background: rgba(0,0,0,.2); color: rgba(255,255,255,.85); display: grid; place-items: center; }
.b-ptabs { display: flex; border-bottom: 1px solid var(--b-line); flex-shrink: 0; }
.b-ptab { padding: 9px 13px; font-size: 11px; font-weight: 700; color: var(--b-muted); border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.b-ptab.on { border-bottom-color: var(--b-indigo); color: #4338ca; background: var(--b-indigo-50); }
.b-ptab em { font-style: normal; background: #e2e8f0; color: #475569; font-size: 9.5px; padding: 0 5px; border-radius: 99px; }

    h += sec("artiste", '<h4><span style="color:#facc15">' + I("star") + "</span> Fiche artiste</h4>" +
      fld("Année de création", NP.year, "Ex: 2022", ar) + fld("Label / Distribution", NP.label, "Ex: Autoproduit, Sony...", ar) +
      fld("Biographie artistique", NP.bio, "Description du projet artistique, histoire, style...", ar, "full") + fld("Composition (membres)", NP.members, "Ex: Marie Dupont — Chant / Jean Martin — Guitare...", ar, "full") +
      '<h4 style="margin-top:6px"><span style="color:#34d399">' + I("hand") + "</span> Conditions de booking</h4>" +
      fld("Cachet minimum (€)", NP.minFee, "0", ar) + fld("Types de contrat acceptés", NP.contracts, "Ex: Cession, Co-réalisation...", ar) + fld("Frais de route / hébergement", NP.route, "Ex: 0,40€/km + 2 nuits hotel si > 200km", ar, "full") +
      fld("Note interne", NP.internal, "Notes internes sur les conditions, contacts, stratégie...", ar, "full"));
    h += '<div class="b-sec" data-zone="look" id="sec-look"><div><span class="b-lab">Icône du projet</span><div class="b-icons">' +
      ICONS.map((ic) => '<button data-icon="' + ic + '" class="' + (look.icon === ic ? "on" : "") + '" aria-label="Icône ' + ic + '">' + I(ic) + "</button>").join("") + "</div></div>" +
      '<div><span class="b-lab">Couleur (Planning)</span><div class="b-swatches">' +
      COLORS.map((c) => '<button data-color="' + c + '" class="' + (look.color === c ? "on" : "") + '" style="background:' + c + '" aria-label="Couleur ' + c + '"></button>').join("") + "</div></div></div>";
    h += "</div>" + '<div class="b-pfoot"><div></div><div style="display:flex;gap:6px"><button class="b-btn ghost">Annuler</button><button class="b-btn indigo" data-act="save-proj">Enregistrer</button></div></div></div></div>';
    return h;
  }

  /* ---------- Fiche projet (consultation) ---------- */
  function projHTML() {
    const p = OISEAUX;
    const tabs = [["artiste", "star", "Artiste"], ["resume", "bars", "Résumé"], ["affaires", "calendar", "Affaires", 2], ["structures", "building", "Structures", 2], ["contacts", "book", "Contacts", 3], ["notes", "note", "Notes", notes.length]];
    let body = "", cls = "b-pbody";
    const t = S.projTab;
    if (t === "artiste") {
      body = '<div class="b-art"><div class="card"><h5>Fiche Artiste <a href="#" onclick="return false">Modifier</a></h5><div class="kv4"><div><small>Genre</small>Théâtre jeune public</div><div><small>Création</small>2023</div><div><small>Label / Distribution</small>Autoproduit</div><div><small>Durée spectacle</small>55 min</div></div></div>' +
        '<div class="card"><h5>Biographie</h5><p>Une fable sans paroles sur les oiseaux migrateurs, pour les enfants dès 4 ans. Ombres, papier découpé et musique jouée en direct.</p></div>' +
        '<div class="card"><h5>Conditions de booking</h5><div class="kv3"><div><small>Cachet catalogue</small>2 200 € HT</div><div><small>Cachet minimum</small>1 800 €</div><div><small>Types de contrat</small>Cession</div><div><small>Frais de route</small>0,40 €/km</div><div><small>Équipe</small>3 personne(s)</div></div></div>' +
        '<div class="card"><h5>Liens & Réseaux</h5><div class="b-links"><span style="background:#fef2f2;color:#b91c1c">' + I("video") + ' Vidéo</span><span style="background:#eef2ff;color:#4338ca">' + I("press") + ' Dossier de presse</span><span style="background:#1e293b;color:#fff">' + I("tech") + ' Fiche technique</span><span style="background:#fdf2f8;color:#be185d">' + I("insta") + " Instagram</span></div></div></div>";
    } else if (t === "resume") {
      body = '<div class="b-stats"><div class="b-stat green"><small>CA Confirmé</small><b>' + money(2200) + '</b></div><div class="b-stat"><small>Confirmées</small><b>1</b></div>' +
        '<div class="b-stat orange"><small>En cours</small><b>1</b></div><div class="b-stat"><small>Annulées</small><b>0</b></div>' +
        '<div class="b-stat indigo"><small>Taux conf.</small><b>50%</b></div><div class="b-stat"><small>Prochaine date</small><b style="font-size:13px">Salle des fêtes<br><span style="font-weight:400;color:var(--b-muted)">2026-12-12</span></b></div></div>' +
        '<div class="b-box"><h5>Logistique & Vente</h5><div class="kv"><span>Cachet : <b>2 200 € HT</b></span><span>Prix vente : <b>2 500 €</b></span><span>Prix places : <b>8 €</b></span><span>Durée : <b>55 min</b></span><span>Équipe : <b>3 pers.</b></span></div>' +
        '<h5 style="margin-top:10px">Matériel Promo</h5><div class="b-promo" style="margin-top:0"><span>' + I("video") + ' Vidéo</span><span>' + I("press") + ' Dossier de Presse</span><span>' + I("tech") + ' Fiche Technique</span><span class="off">' + I("globe") + " Aucun site</span></div></div>";
    } else if (t === "affaires") {
      body = '<div class="b-afhead"><h4>2 affaire(s)</h4><button class="b-btn indigo">' + I("plus") + " Nouvelle affaire</button></div>" +
        '<div class="b-afrow"><div class="sq" style="background:#fb923c">' + I("hour") + '</div><div class="t"><b>MJC des Tilleuls</b><small>Craponne-sur-Arzon · 2027-01-22</small></div><div class="m"><b>' + money(2400) + "</b><small>HT</small></div></div>" +
        '<div class="b-afrow"><div class="sq" style="background:#10b981">' + I("check") + '</div><div class="t"><b>Salle des fêtes</b><small>Bas-en-Basset · 2026-12-12</small></div><div class="m"><b>' + money(2200) + "</b><small>HT</small></div></div>";
    } else if (t === "structures") {
      body = '<div class="b-afhead"><h4>2 structure(s) liée(s)</h4></div><div class="b-g2c">' +
        '<div class="b-scard"><b>MJC des Tilleuls</b><small>' + I("marker") + ' Craponne-sur-Arzon</small><div class="tags"><span>MJC</span><span>Jeune public</span></div></div>' +
        '<div class="b-scard"><b>Salle des fêtes</b><small>' + I("marker") + ' Bas-en-Basset</small><div class="tags"><span>Mairie</span></div></div></div>';
    } else if (t === "contacts") {
      const qa = '<div class="qa"><span>CRM</span><span>Tâche</span><span>Affaire</span></div>';
      body = '<div class="b-afhead"><h4>3 contact(s) lié(s)</h4></div><div class="b-g2c">' +
        '<div class="b-scard"><b>Claire Vidal</b><div class="role">Programmatrice</div><small>MJC des Tilleuls</small>' + qa + "</div>" +
        '<div class="b-scard"><b>Thomas Brun</b><div class="role">Régisseur</div><small>MJC des Tilleuls</small>' + qa + "</div>" +
        '<div class="b-scard"><b>Nadia Faure</b><div class="role">Adjointe à la culture</div><small>Salle des fêtes</small>' + qa + "</div></div>";
    } else {
      cls += " notes";
      body = '<div class="b-nbar" data-zone="nbar"><input id="n-text" class="b-field" placeholder="Ajouter une note... (Entrée pour valider)" autocomplete="off"><button class="b-btn indigo" data-act="add-note">' + I("plus") + ' Ajouter</button>' +
        '<button class="b-btn amber' + (S.actionForm ? " on" : "") + '" data-act="toggle-action">' + I("calendar") + " Planifier une action</button></div>";
      if (S.actionForm) {
        body += '<div class="b-aform" data-zone="aform"><input id="a-text" class="b-field" placeholder="Ex: Relancer le programmateur pour le devis..." value="Rappeler le Théâtre de Monistrol pour fixer une date">' +
          '<div class="row"><select id="a-type" class="b-field" style="flex:1"><option value="call">📞 Appel</option><option value="email">✉️ Email / Relance</option><option value="meeting">🤝 Rendez-vous</option><option value="admin">📝 Administratif</option><option value="other">📌 Autre</option></select>' +
          '<input id="a-date" type="date" class="b-field" style="width:140px" value="' + iso(plusDays(3)) + '"><input id="a-time" type="time" class="b-field" style="width:96px" value="10:30">' +
          '<button class="b-btn amberfill" data-act="save-action">' + I("check") + " Enregistrer</button></div></div>";
      }
      let list = "";
      if (actions.length) {
        const ic = { call: "phone", email: "mail", meeting: "book", admin: "file", other: "pin" };
        list += '<div class="b-nsec">Actions à venir</div>' + actions.map((a) => '<div class="b-act' + (S.fresh === "action" ? " fresh" : "") + '"><span style="color:#cbd5e1">' + I("circle") + "</span><span style=\"color:#3b82f6\">" + I(ic[a.type] || "pin") + '</span><span style="flex:1">' + esc(a.text) + '</span><span class="when">' + fr(a.date) + (a.time ? " · " + a.time : "") + '</span><span class="gh">' + I("pen") + I("trash") + "</span></div>").join("") + '<div class="b-nsec" style="margin-top:12px">Notes</div>';
      }
      list += notes.slice().reverse().map((n, i) => '<div class="b-note' + (i === 0 && S.fresh === "note" ? " fresh" : "") + '"><p>' + esc(n.text) + "</p><small>" + I("clock") + n.date + " · " + esc(n.user) + "</small></div>").join("");
      body += '<div class="list">' + list + "</div>";
    }
    return '<div class="b-overlay"><div class="b-pmodal"><div class="b-pban" style="background:' + p.color + '"><div class="grad"><div><small>' + I("music") + " " + p.genre + "</small><h3>" + esc(p.name) + '</h3></div></div><span class="close">' + I("x") + "</span></div>" +
      '<div class="b-ptabs">' + tabs.map(([k, ic, l, n]) => '<span class="b-ptab' + (t === k ? " on" : "") + '" data-act="ptab-' + k + '">' + I(ic) + " " + l + (n !== undefined ? "<em>" + n + "</em>" : "") + "</span>").join("") + "</div>" +
      '<div class="' + cls + '">' + body + "</div></div></div>";
  }

  function render() {
    const view = S.tab === "projects" ? projectsHTML() : dashHTML();
    const top = S.tab === "projects" ? '<button class="b-btn slate" data-act="new-proj">' + I("plus") + " Projet</button>" : "<span></span>";
    bob.innerHTML = sidebar() +
      '<div class="b-main"><div class="b-top"><h2>' + (S.tab === "projects" ? "Mes Projets" : "Tableau de bord") + "</h2>" + top + "</div>" +
      '<div class="b-content"' + (S.tab === "projects" ? ' style="background:var(--b-body)"' : "") + ">" + view + "</div></div>" +
      (S.edit ? editHTML() : "") + (S.proj ? projHTML() : "") +
      (S.toast ? '<div class="b-toast">' + I("check") + " " + S.toast + "</div>" : "") +
      '<div class="spot off" id="spot"></div>';
    const pf = document.getElementById("pform");
    if (pf) {
      const target = document.getElementById("sec-" + S.sec);
      if (target && !S.keepScroll) { const d = (target.getBoundingClientRect().top - pf.getBoundingClientRect().top) / (scale || 1); pf.scrollTop = pf.scrollTop + d - 12; }
      pf.addEventListener("scroll", placeSpot, { passive: true });
    }
    const n = document.getElementById("n-text");
    if (n) n.addEventListener("keydown", (e) => { if (e.key === "Enter" && STEPS[step].act["add-note"]) { e.preventDefault(); addNote(); } });
    requestAnimationFrame(placeSpot);
    renderGuide();
  }
  function renderKeepScroll() { const pf = document.getElementById("pform"); const top = pf ? pf.scrollTop : 0; S.keepScroll = true; render(); S.keepScroll = false; const nf = document.getElementById("pform"); if (nf) nf.scrollTop = top; placeSpot(); }

  /* ---------- Projecteur, notification ---------- */
  function placeSpot() {
    const spot = document.getElementById("spot");
    if (!spot) return;
    const sel = STEPS[step].target && STEPS[step].target();
    const el = sel ? bob.querySelector(sel) : null;
    if (!el) { spot.classList.add("off"); return; }
    const b = bob.getBoundingClientRect(), r = el.getBoundingClientRect(), s = scale || 1, pad = 5;
    const x = Math.max(3, (r.left - b.left) / s - pad), y = Math.max(3, (r.top - b.top) / s - pad);
    const x2 = Math.min(1037, (r.right - b.left) / s + pad), y2 = Math.min(637, (r.bottom - b.top) / s + pad);
    spot.style.left = x + "px"; spot.style.top = y + "px";
    spot.style.width = Math.max(0, x2 - x) + "px"; spot.style.height = Math.max(0, y2 - y) + "px";
    spot.classList.remove("off");
  }
  function flash(sel) { const el = bob.querySelector(sel); if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } }
  let toastTimer = null;
  function toast(msg) { S.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; const t = bob.querySelector(".b-toast"); if (t) t.remove(); }, 2200); }

  /* ---------- Panneau de guidage ---------- */
  const guide = document.getElementById("guide"), rail = document.getElementById("rail");
  function renderGuide() {
    const st = STEPS[step];
    let h = '<div class="g-count"><span class="g-partlab">' + st.part + "</span><span>Étape " + (step + 1) + " sur " + STEPS.length + "</span></div>" + '<h2 class="g-title">' + st.title + "</h2>";
    if (st.final) {
      let lp = "";
      h += '<div class="g-body"><p>Vous savez créer un projet, lire sa fiche et y garder notes et actions. Pour revoir une étape :</p></div><ol class="g-recap">' +
        STEPS.slice(0, -1).map((s, i) => { const head = s.part !== lp ? '<li class="g-part">' + s.part + "</li>" : ""; lp = s.part; return head + '<li><button data-go="' + i + '"><span>' + (i + 1) + "</span>" + s.title + "</button></li>"; }).join("") + "</ol>" +
        '<p class="g-tip">Pour créer et suivre les affaires d’un projet, voyez la visite « Gérer une affaire dans Bob ».</p>';
    } else {
      const doText = typeof st.doText === "function" ? st.doText() : st.doText;
      h += '<div class="g-body">' + st.body + "</div>" + '<div class="g-do">' + I("pointer") + "<span>" + doText + "</span></div>" +
        (st.free ? "" : '<p class="g-tip">Vous pouvez aussi faire Suivant : la visite le fera à votre place.</p>');
    }
    h += '<div class="g-nav"><button class="g-btn" data-nav="prev"' + (step === 0 ? " disabled" : "") + ">" + I("left") + " Précédent</button>" +
      (st.final ? '<button class="g-btn primary" data-go="0">Recommencer</button>' : '<button class="g-btn primary" data-nav="next">Suivant ' + I("right") + "</button>") + "</div>";
    guide.innerHTML = h;
    let lp = "";
    rail.innerHTML = STEPS.map((s, i) => { const gap = s.part !== lp && i > 0 ? '<span class="rail-sep" aria-hidden="true"></span>' : ""; lp = s.part;
      return gap + '<button data-go="' + i + '" class="' + (i === step ? "cur" : seen.has(i) ? "seen" : "") + '" aria-label="Étape ' + (i + 1) + " : " + s.title + '"' + (i === step ? ' aria-current="step"' : "") + ' title="' + s.part + " : " + s.title + '">' + (i + 1) + "</button>"; }).join("") +
      '<span class="rail-hint">Flèches ← → du clavier pour naviguer</span>';
  }

  /* ---------- Navigation ---------- */
  function go(i) {
    step = Math.max(0, Math.min(STEPS.length - 1, i));
    seen.add(step);
    if (step < 15) notes = notesInit();
    if (step < 16) actions = [];
    const prev = S;
    S = Object.assign(base(), { toast: prev.toast, fresh: null }, STEPS[step].setup(prev));
    render();
  }
  function advance() { go(step + 1); }
  function next() {
    const st = STEPS[step];
    if (st.free || st.final) return advance();
    if (st.next) return st.next();
    const k = Object.keys(st.act)[0];
    if (k) st.act[k](); else advance();
  }
  guide.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.nav === "prev") go(step - 1); else if (b.dataset.nav === "next") next(); else if (b.dataset.go !== undefined) go(Number(b.dataset.go));
  });
  rail.addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) go(Number(b.dataset.go)); });
  document.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    if (e.key === "ArrowRight") next(); else if (e.key === "ArrowLeft") go(step - 1);
  });

  bob.addEventListener("click", (e) => {
    const ic = e.target.closest("[data-icon]"); if (ic) { look.icon = ic.dataset.icon; renderKeepScroll(); return; }
    const co = e.target.closest("[data-color]"); if (co) { look.color = co.dataset.color; renderKeepScroll(); return; }
    if (e.target.closest("input, select")) return;
    const a = e.target.closest("[data-act]"); if (!a) return;
    const st = STEPS[step];
    if (st.act[a.dataset.act]) st.act[a.dataset.act]();
  });

  /* ---------- Mise à l’échelle ---------- */
  let scale = 1;
  const frame = document.getElementById("frame"), box = document.getElementById("scaleBox");
  function fit() { scale = Math.min(1.15, frame.clientWidth / 1040); bob.style.transform = "scale(" + scale + ")"; box.style.height = 640 * scale + "px"; placeSpot(); }
  new ResizeObserver(fit).observe(frame);
  window.addEventListener("resize", fit);

  go(0);
  fit();
})();

</script>
</body>
</html>
